name: document-compliance-production

x-backend-image: &backend_image
  image: ${BACKEND_IMAGE:-document-compliance-backend:1.0.0}
  build:
    context: ./backend
    dockerfile: Dockerfile

x-backend-runtime: &backend_runtime
  <<: *backend_image
  restart: unless-stopped
  env_file:
    - ${PRODUCTION_ENV_FILE:-.env.production}
  environment:
    DATABASE_HOST: postgres
    REDIS_HOST: redis
    STORAGE_ROOT: /app/storage
    MICROSOFT_CLIENT_CERTIFICATE_PATH: /run/secrets/microsoft-client-certificate.pem
  volumes:
    - document_storage:/app/storage
    - ./models:/app/models:ro
    - ${MICROSOFT_CLIENT_CERTIFICATE_HOST_PATH:-./deploy/secrets/empty.pem}:/run/secrets/microsoft-client-certificate.pem:ro
  tmpfs:
    - /tmp:size=2g,mode=1770
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - private

x-worker: &worker
  <<: *backend_runtime
  stop_grace_period: 2m
  healthcheck:
    interval: 30s
    timeout: 15s
    retries: 5
    start_period: 45s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - private

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}" --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - private

  migrate:
    <<: *backend_runtime
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *backend_runtime
    command:
      - sh
      - -ec
      - >-
        exec gunicorn app.main:app
        --worker-class uvicorn.workers.UvicornWorker
        --workers "$${API_WORKERS:-4}"
        --bind 0.0.0.0:8000
        --timeout "$${API_TIMEOUT_SECONDS:-120}"
        --graceful-timeout "$${API_GRACEFUL_TIMEOUT_SECONDS:-30}"
        --access-logfile -
        --error-logfile -
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: ${FRONTEND_IMAGE:-document-compliance-frontend:1.0.0}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_API_URL: /api/v1
        VITE_APP_VERSION: 1.0.0
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - private

  worker-extraction:
    <<: *worker
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--queues=extraction", "--concurrency=2", "--hostname=extraction@%h", "--max-tasks-per-child=100"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --destination=extraction@$${HOSTNAME} --timeout=10 | grep -q pong"]

  worker-ocr:
    <<: *worker
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--queues=ocr", "--concurrency=1", "--hostname=ocr@%h", "--max-tasks-per-child=10"]
    shm_size: "1gb"
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --destination=ocr@$${HOSTNAME} --timeout=10 | grep -q pong"]

  worker-language:
    <<: *worker
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--queues=language", "--concurrency=2", "--hostname=language@%h", "--max-tasks-per-child=100"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --destination=language@$${HOSTNAME} --timeout=10 | grep -q pong"]

  worker-compliance:
    <<: *worker
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--queues=compliance", "--concurrency=2", "--hostname=compliance@%h", "--max-tasks-per-child=100"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --destination=compliance@$${HOSTNAME} --timeout=10 | grep -q pong"]

  worker-similarity:
    <<: *worker
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--queues=similarity", "--concurrency=1", "--hostname=similarity@%h", "--max-tasks-per-child=10"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --destination=similarity@$${HOSTNAME} --timeout=10 | grep -q pong"]

  worker-glossary:
    <<: *worker
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--queues=glossary", "--concurrency=2", "--hostname=glossary@%h", "--max-tasks-per-child=100"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --destination=glossary@$${HOSTNAME} --timeout=10 | grep -q pong"]

  worker-revision:
    <<: *worker
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--queues=revision-comparison", "--concurrency=2", "--hostname=revision@%h", "--max-tasks-per-child=50"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --destination=revision@$${HOSTNAME} --timeout=10 | grep -q pong"]

  worker-reporting:
    <<: *worker
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--queues=reporting", "--concurrency=1", "--hostname=reporting@%h", "--max-tasks-per-child=50"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --destination=reporting@$${HOSTNAME} --timeout=10 | grep -q pong"]

  worker-sharepoint:
    <<: *worker
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--queues=sharepoint", "--concurrency=${SHAREPOINT_WORKER_CONCURRENCY:-4}", "--hostname=sharepoint@%h", "--max-tasks-per-child=50"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --destination=sharepoint@$${HOSTNAME} --timeout=10 | grep -q pong"]

  worker-notifications:
    <<: *worker
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--queues=notifications", "--concurrency=2", "--hostname=notifications@%h", "--max-tasks-per-child=100"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --destination=notifications@$${HOSTNAME} --timeout=10 | grep -q pong"]

  worker-maintenance:
    <<: *worker
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--queues=maintenance", "--concurrency=1", "--hostname=maintenance@%h", "--max-tasks-per-child=25"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --destination=maintenance@$${HOSTNAME} --timeout=10 | grep -q pong"]

  celery-beat:
    <<: *backend_runtime
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO", "--schedule=/app/storage/celerybeat/celerybeat-schedule"]
    stop_grace_period: 30s

  clamav:
    image: clamav/clamav:1.4
    profiles: ["malware"]
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 2m
    networks:
      - private

  nginx:
    image: nginxinc/nginx-unprivileged:1.30.4-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:8080"
      - "${NGINX_HTTPS_PORT:-443}:8443"
    volumes:
      - ./deploy/nginx/document-compliance.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERTIFICATE_PATH:-./deploy/secrets/tls/fullchain.pem}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_PRIVATE_KEY_PATH:-./deploy/secrets/tls/privkey.pem}:/etc/nginx/tls/privkey.pem:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=128m
      - /var/run:size=8m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - public
      - private

volumes:
  postgres_data:
  postgres_backups:
  redis_data:
  document_storage:
  clamav_data:

networks:
  public:
  private:
    internal: true

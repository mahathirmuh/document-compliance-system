          "CMD",
          "python",
          "-c",
          "import os, urllib.request; prefix = os.environ.get('API_V1_PREFIX', '/api/v1').rstrip('/'); urllib.request.urlopen(f'http://localhost:8000{prefix}/health', timeout=5)",
